<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Table with Top-left and Bottom-right Text</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<table>
  <tr>
    <td>
      <div class="top-left">TL1</div>
      <div class="bottom-right">BR1</div>
    </td>
    <td>
      <div class="top-left">TL2</div>
      <div class="bottom-right">BR2</div>
    </td>
  </tr>
  <tr>
    <td>
      <div class="top-left">TL3</div>
      <div class="bottom-right">BR3</div>
    </td>
    <td>
      <div class="top-left">TL4</div>
      <div class="bottom-right">BR4</div>
    </td>
  </tr>
</table>

</body>
</html>
